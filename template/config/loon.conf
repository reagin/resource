https://gh-proxy.com/https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/loon/crypto.list, policy=全球服务, tag=Crypto, enabled=true
# 系统推送与大厂服务
https://gh-proxy.com/https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/loon/apple.list, policy=全球服务, tag=Apple, enabled=true
https://gh-proxy.com/https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/loon/google.list, policy=全球服务, tag=Google, enabled=true
