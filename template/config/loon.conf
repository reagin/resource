https://gh-proxy.com/https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/loon/proxy.list, policy=全球服务, tag=ProxyList, enabled=true
https://gh-proxy.com/https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/loon/socialmedia.list, policy=全球服务, tag=SocialMedia, enabled=true
# 国内网址分流
https://gh-proxy.com/https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/loon/cn.list, policy=国内服务, tag=ChinaDomain, enabled=true
https://gh-proxy.com/https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/loon/cncidr.list, policy=国内服务, tag=ChinaCIDR, enabled=true
https://gh-proxy.com/https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/loon/socialmedia-cn.list, policy=国内服务, tag=SocialMediaCN, enabled=true

# =====================================
# Rewrite 请求重写
# =====================================
[Rewrite]
^https?:\/\/(www.)?(g|google)\.cn https://www.google.com 302

# =====================================
# Script 代理脚本
# =====================================
[Script]

# =====================================
# Mitm 代理证书
# =====================================
[Mitm]
ca-p12 =
ca-passphrase = 
skip-server-cert-verify = false
