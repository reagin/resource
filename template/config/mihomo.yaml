port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: false
mode: rule
ipv6: false
log-level: info
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  cache-algorithm: arc
  respect-rules: true
  enhanced-mode: redir-host
  nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    geosite:geolocation-!cn:
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
tun:
  enable: true
  stack: mixed
  device: utun
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  endpoint-independent-nat: true
sniffer:
  enable: true
  sniff:
    QUIC:
      ports: [443, 8443]
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "+.oray.com"
    - "+.apple.com"
    - "+.sunlogin.net"
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
proxies:
  - name: 🗽 California Trojan
    type: trojan
    server: <<user_ip>>
    port: 10080
    password: <<user_password>>
    sni: <<user_domain>>
    tls: false
    tfo: false
    network: tcp
    skip-cert-verify: false
  - name: 🗽 California Hysteria2
    type: hysteria2
    server: <<user_ip>>
    port: 10053
    password: <<user_password>>
    sni: <<user_domain>>
    up: 300 Mbps
    down: 300 Mbps
    skip-cert-verify: false
proxy-groups:
  - { name: ⚡️ 自动选择, type: fallback, proxies: [🗽 California Hysteria2, 🗽 California Trojan], url: https://www.gstatic.com/generate_204, interval: 300 }
  - { name: ✨ 节点选择, type: select, proxies: [DIRECT, REJECT, ⚡️ 自动选择, 🗽 California Trojan, 🗽 California Hysteria2] }
  - { name: 🏠 国内服务, type: select, proxies: [DIRECT, REJECT, ✨ 节点选择, 🗽 California Trojan, 🗽 California Hysteria2] }
  - { name: 🚀 全球服务, type: select, proxies: [DIRECT, REJECT, ✨ 节点选择, 🗽 California Trojan, 🗽 California Hysteria2] }
  - { name: 🐟 漏网之鱼, type: select, proxies: [DIRECT, REJECT, ✨ 节点选择, 🗽 California Trojan, 🗽 California Hysteria2] }
rules:
  - RULE-SET,private_ip,🏠 国内服务,no-resolve
  - RULE-SET,private_domain,🏠 国内服务
  - RULE-SET,ai_domain,🚀 全球服务
  - RULE-SET,github_domain,🚀 全球服务
  - RULE-SET,youtube_domain,🚀 全球服务
  - RULE-SET,google_domain,🚀 全球服务
  - RULE-SET,onedrive_domain,🚀 全球服务
  - RULE-SET,microsoft_domain,🚀 全球服务
  - RULE-SET,apple_domain,🚀 全球服务
  - RULE-SET,tiktok_domain,🚀 全球服务
  - RULE-SET,telegram_domain,🚀 全球服务
  - RULE-SET,netflix_domain,🚀 全球服务
  - RULE-SET,paypal_domain,🚀 全球服务
  - RULE-SET,apple_ip,🚀 全球服务
  - RULE-SET,google_ip,🚀 全球服务
  - RULE-SET,netflix_ip,🚀 全球服务
  - RULE-SET,telegram_ip,🚀 全球服务
  - RULE-SET,geolocation-!cn,🚀 全球服务
  - RULE-SET,cn_domain,🏠 国内服务
  - RULE-SET,cn_ip,🏠 国内服务,no-resolve
  - MATCH,🐟 漏网之鱼
rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
rule-providers:
