port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  asn: https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
rule-providers:
  cn:
    type: http
    format: mrs
    behavior: domain
    url: https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/cn.mrs
    path: ./ruleset/cn.mrs
    interval: 86400
  geolocation-cn:
    type: http
    format: mrs
    behavior: domain
    url: https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/geolocation-cn.mrs
    path: ./ruleset/geolocation-cn.mrs
    interval: 86400
  geolocation-!cn:
    type: http
    format: mrs
    behavior: domain
    url: https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/geolocation-!cn.mrs
    path: ./ruleset/geolocation-!cn.mrs
    interval: 86400
  cn-ip:
    type: http
    format: mrs
    behavior: ipcidr
    url: https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/cn.mrs
    path: ./ruleset/cn-ip.mrs
    interval: 86400
  private-ip:
    type: http
    format: mrs
    behavior: ipcidr
    url: https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/private.mrs
    path: ./ruleset/private-ip.mrs
    interval: 86400
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    geosite:geolocation-!cn:
      - https://dns.google/dns-query
      - https://dns.cloudflare.com/dns-query
proxies:
  - name: 🗽 California Trojan
    type: trojan
    server: <<user_ip>>
    port: 10080
    password: <<user_password>>
    tls: false
    sni: <<user_domain>>
    network: tcp
    tfo: false
    skip-cert-verify: false
  - name: 🗽 California Hysteria
    type: hysteria2
    server: <<user_ip>>
    port: 10053
    password: <<user_password>>
    up: 200 Mbps
    down: 200 Mbps
    sni: <<user_domain>>
    skip-cert-verify: false
proxy-groups:
  - type: select
    name: ✨ 节点选择
    proxies:
      - DIRECT
      - REJECT
      - ⚡️ 自动选择
      - 🗽 California Trojan
      - 🗽 California Hysteria
  - name: ⚡️ 自动选择
    type: url-test
    proxies:
      - 🗽 California Trojan
      - 🗽 California Hysteria
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false
  - type: select
    name: 🏠 私有网络
    proxies:
      - DIRECT
      - REJECT
      - ✨ 节点选择
      - 🗽 California Trojan
      - 🗽 California Hysteria
  - type: select
    name: 🔒 国内服务
    proxies:
      - DIRECT
      - REJECT
      - ✨ 节点选择
      - 🗽 California Trojan
      - 🗽 California Hysteria
  - type: select
    name: 🚀 全球服务
    proxies:
      - DIRECT
      - REJECT
      - ✨ 节点选择
      - 🗽 California Trojan
      - 🗽 California Hysteria
  - type: select
    name: 🐟 漏网之鱼
    proxies:
      - DIRECT
      - REJECT
      - ✨ 节点选择
      - 🗽 California Trojan
      - 🗽 California Hysteria
rules:
  - RULE-SET,cn,🔒 国内服务
  - RULE-SET,geolocation-cn,🔒 国内服务
  - RULE-SET,geolocation-!cn,🚀 全球服务
  - RULE-SET,private-ip,🏠 私有网络,no-resolve
  - RULE-SET,cn-ip,🔒 国内服务,no-resolve
  - MATCH,🐟 漏网之鱼
